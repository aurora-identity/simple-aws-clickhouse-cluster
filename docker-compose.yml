# The same cluster that runs on AWS, on one machine: two ClickHouse replicas, three Keeper
# nodes, and a one-shot job that applies the schema once both replicas answer.
#
# Replica 0 is on localhost:8123 (HTTP) and 9000 (native); replica 1 on 8124 and 9001.

x-hosts: &hosts
  CH_KEEPER_0_HOST: keeper-0
  CH_KEEPER_1_HOST: keeper-1
  CH_KEEPER_2_HOST: keeper-2
  CH_REPLICA_0_HOST: clickhouse-0
  CH_REPLICA_1_HOST: clickhouse-1

x-keeper: &keeper
  image: clickhouse/clickhouse-keeper:25.10-alpine

x-server: &server
  image: clickhouse/clickhouse-server:25.10
  ulimits:
    nofile: { soft: 262144, hard: 262144 }
  depends_on: [keeper-0, keeper-1, keeper-2]
  healthcheck:
    test: ["CMD", "wget", "-qO", "-", "http://localhost:8123/ping"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s

services:
  keeper-0:
    <<: *keeper
    environment: { <<: *hosts, KEEPER_ID: "1" }
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-0-data:/var/lib/clickhouse-keeper

  keeper-1:
    <<: *keeper
    environment: { <<: *hosts, KEEPER_ID: "2" }
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-1-data:/var/lib/clickhouse-keeper

  keeper-2:
    <<: *keeper
    environment: { <<: *hosts, KEEPER_ID: "3" }
    volumes:
      - ./config/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper-2-data:/var/lib/clickhouse-keeper

  clickhouse-0:
    <<: *server
    environment: { <<: *hosts, CH_SHARD: "1", CH_REPLICA: clickhouse-0 }
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./config/server/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/server/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-0-hot:/var/lib/clickhouse
      - clickhouse-0-warm:/var/lib/clickhouse-warm

  clickhouse-1:
    <<: *server
    environment: { <<: *hosts, CH_SHARD: "1", CH_REPLICA: clickhouse-1 }
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./config/server/config.d:/etc/clickhouse-server/config.d:ro
      - ./config/server/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-1-hot:/var/lib/clickhouse
      - clickhouse-1-warm:/var/lib/clickhouse-warm

  schema:
    image: clickhouse/clickhouse-server:25.10
    entrypoint: ["/schema/apply.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse-0
    volumes:
      - ./schema:/schema:ro
    depends_on:
      clickhouse-0: { condition: service_healthy }
      clickhouse-1: { condition: service_healthy }

volumes:
  keeper-0-data:
  keeper-1-data:
  keeper-2-data:
  clickhouse-0-hot:
  clickhouse-0-warm:
  clickhouse-1-hot:
  clickhouse-1-warm:
