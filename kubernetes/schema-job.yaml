# Applies schema/*.sql to the cluster, once. `make schema` builds the ConfigMap from the
# schema/ directory, deletes any previous run of this job, and applies this file.
#
# The job runs schema/apply.sh against replica 0. The statements are ON CLUSTER, so that
# reaches both replicas. It retries until the replicas are up, which is why it is safe to
# run straight after `make deploy`.
apiVersion: batch/v1
kind: Job
metadata:
  name: apply-schema
  namespace: clickhouse
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-schema
          image: clickhouse/clickhouse-server:25.10
          imagePullPolicy: IfNotPresent
          command: ["/schema/apply.sh"]
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse-0.clickhouse.clickhouse.svc.cluster.local
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: clickhouse-schema
            defaultMode: 0755
